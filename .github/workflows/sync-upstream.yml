
name: Auto Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git fetch https://github.com/thedogecraft/sparkle.git v2

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit FETCH_HEAD

      - name: Push updates
        run: git push origin v2
